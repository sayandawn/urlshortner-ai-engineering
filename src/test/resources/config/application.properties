# Test-only overrides. Spring Boot loads classpath:config/application.properties in addition to
# (and with higher precedence than) classpath:application.properties, so only these keys change.
# Rate limiting stays enabled so every test exercises the interceptor, but with limits no test
# reaches. RateLimitIntegrationTest sets its own small limits.
app.rate-limit.limits.create.limit-for-period=1000000
app.rate-limit.limits.redirect.limit-for-period=1000000
app.rate-limit.limits.lookup.limit-for-period=1000000
app.rate-limit.limits.analytics.limit-for-period=1000000

# Click counting runs on the caller's thread in the general suite, so tests that check the click
# count right after a redirect stay deterministic. Click-counting tests enable async explicitly.
app.click-counting.async=false
