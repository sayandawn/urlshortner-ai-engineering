# Production profile: activated with SPRING_PROFILES_ACTIVE=prod.
# Persistent, file-based H2 on a mounted volume, migrated by Flyway, instead of the local
# dev in-memory database. See docs/SETUP.md.

# DB_PATH should point inside a mounted, persistent volume (e.g. /var/lib/urlshortener/urlshortener).
# H2 appends its own file extension; DB_CLOSE_ON_EXIT=FALSE avoids a race between Flyway/Hibernate
# and H2 closing the file on a normal shutdown.
spring.datasource.url=jdbc:h2:file:${DB_PATH};DB_CLOSE_ON_EXIT=FALSE
# DB_USERNAME and DB_PASSWORD are required, with no fallback: a deployment that forgets to set them
# must fail at startup, not silently run production on a default credential.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway, not Hibernate, owns schema changes here. Hibernate only validates the entity still
# matches what Flyway created; it never alters the schema itself.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Never expose a database browser in production, regardless of the base profile's default.
spring.h2.console.enabled=false

# This service is expected to run behind a reverse proxy / load balancer in production, so the
# generated shortUrl uses the external host and scheme the proxy saw, not the internal one.
server.forward-headers-strategy=framework
