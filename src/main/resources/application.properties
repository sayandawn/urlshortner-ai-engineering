spring.application.name=urlshortner-ai-engineering

spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console for browsing the in-memory database during local development.
spring.h2.console.enabled=true

# Flyway is on the classpath for the "prod" profile (application-prod.properties), which uses a
# persistent, file-based H2 with ddl-auto=validate. Local dev and tests keep ddl-auto=update and
# never run migrations.
spring.flyway.enabled=false

# Health check: only /actuator/health, /actuator/health/liveness and /actuator/health/readiness are
# exposed (no other Actuator endpoints). Liveness/readiness match Kubernetes probe conventions.
# Not rate-limited: RateLimitInterceptor only enforces limits on methods annotated @RateLimited,
# and Actuator's own handlers never carry that annotation.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Service-level rate limiting (Resilience4j, in-memory, global per endpoint group, not per client).
# These are configurable PROTOTYPE DEFAULTS for demonstration, not production capacity values;
# production limits should come from real traffic, load testing and SLO requirements.
# When enabled, every group below must be configured or the application fails to start.
app.rate-limit.enabled=true
app.rate-limit.limits.create.limit-for-period=10
app.rate-limit.limits.create.limit-refresh-period=1m
app.rate-limit.limits.redirect.limit-for-period=60
app.rate-limit.limits.redirect.limit-refresh-period=1m
app.rate-limit.limits.lookup.limit-for-period=60
app.rate-limit.limits.lookup.limit-refresh-period=1m
app.rate-limit.limits.analytics.limit-for-period=30
app.rate-limit.limits.analytics.limit-refresh-period=1m

# Asynchronous click counting: redirects never wait for the click-count update.
# Analytics is eventually consistent. Queued clicks are lost on a crash (written on graceful shutdown);
# when the queue is full, new clicks are dropped and logged. Temporary DB failures are retried with backoff.
app.click-counting.async=true
app.click-counting.pool-size=2
app.click-counting.queue-capacity=10000
app.click-counting.shutdown-await=10s
app.click-counting.retry.max-attempts=5
app.click-counting.retry.initial-interval=100ms
app.click-counting.retry.multiplier=2.0
